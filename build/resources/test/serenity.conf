#
# Pages test websites

pages{
 Orange = "https://opensource-demo.orangehrmlive.com/web/index.php/admin/viewSystemUsers"
}
#
# Serenity parameters
#
serenity {
  browser.maximized = true
  console.colors = true
  logging = VERBOSE
  compromised.on = java.net.ConnectException
  fail.on = java.lang.IllegalAccessError
  timeout = 5000
}


webdriver {
  driver = Chrome
}

environments {
  local {
    webdriver.driver = Chrome
    headless.mode =false
    chrome {
      switches = [
        "--start-maximized",
        "--ignore-certificate-errors",
        "--incognito",
        "--accept-insecure-certs",
        "--acceptSslCerts"
        "--disable-popup-blocking",
        "--disable-infobars",
        "--remote-allow-origins=*"
      ]
      preferences {
        download {
          prompt_for_download: false
          default_directory: "$TEMPDIR"
        }
      }
    }
  }
}